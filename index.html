<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Periapsis Zero — Sol / Terra / Luna</title>
    <meta name="description" content="Real-time N-body solar system simulation driven by an RK4 integrator." />
    <!--
      The tab icon, drawn by scripts/make-favicon.mjs — an orbital arc bending
      through periapsis, the body at the bend, an ember tick beneath naming the
      moment. The script renders every size from one drawing, converts the
      interface's own oklch palette to sRGB so the mark cannot drift from the
      UI, and `--check` verifies the set byte-for-byte. Files are unhashed and
      referenced from the root, because a favicon is requested before any build
      hash can exist to name it.
    -->
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icons/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cormorant Garamond replaces Chakra Petch: a light old-style serif for
         display, at 300 and 400 only, because the point of it is the weight.
         Chakra Petch is dropped rather than kept beside it — an unused family
         is a render-blocking request for nothing. -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
<!-- boot:generated (scripts/make-favicon.mjs owns this block) -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: #080a0d;
        opacity: 1; transition: opacity 0.6s ease;
      }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      #boot .boot-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot .boot-title {
        font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300;
        font-size: 15px; letter-spacing: 0.34em; text-indent: 0.34em; color: #d5c6a1;
      }
    </style>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="72" height="72" role="img" aria-label="Periapsis Zero">
        <rect width="512" height="512" fill="#080a0d"/>
        <path d="M -143.36 92.16 Q 256 645.12 655.36 92.16" fill="none" stroke="#d5c6a1" stroke-width="15.36" stroke-linecap="round"/>
        <path d="M 256 400.38 L 199.68 451.07 M 256 400.38 L 312.32 451.07" fill="none" stroke="#d7733e" stroke-width="19.46" stroke-linecap="round"/>
        <circle cx="256" cy="368.64" r="29.7" fill="#d5c6a1"/>
      </svg>
      
        <div class="boot-title">PERIAPSIS ZERO</div>
      </div>
    </div>
    <script>
      (function () {
        var b = document.getElementById("boot")
        var dismiss = function () {
          if (!b || b.dataset.bootDone) return
          b.dataset.bootDone = "1"
          b.classList.add("boot-done")
          window.setTimeout(function () { b.remove() }, 700)
        }
        /**
         * Fallback handoff. The flight scene dismisses on its first
         * rendered frame (Driver.jsx), but the landing page mounts no
         * Driver — without this the splash would cover the front door
         * forever. Landing gets a short fuse; flight a long one, as pure
         * insurance behind the precise handoff.
         */
        window.setTimeout(dismiss, location.hash === "#flight" ? 12000 : 2500)
      })()
    </script>
<!-- /boot:generated -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
